name: Android Build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Install ninja-build
      run: sudo apt-get install -y ninja-build
    - name: Clone repository
      uses: actions/checkout@v4
    - name: Clone submodules
      run: git submodule update --init --recursive
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: "jetbrains"
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Run musikr unit tests
      run: ./gradlew :musikr:testDebugUnitTest --no-daemon
      continue-on-error: true
    - name: Build arm64 canary APK with Gradle
      run: ./gradlew app:packageCanary
    - name: Upload canary APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Auxio_Canary_arm64
        path: ./app/build/outputs/apk/canary/app-canary.apk
