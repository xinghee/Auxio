name: Android Build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Install ninja-build
      run: sudo apt-get install -y ninja-build
    - name: Clone repository
      uses: actions/checkout@v5
    - name: Point ffmpeg at the GitHub mirror
      run: |
        # git.ffmpeg.org is regularly unreachable from CI runners (timeouts and
        # connection resets). The GitHub mirror carries the same commits, so
        # rewriting the URL keeps the pinned submodule commit resolvable.
        git config --global url."https://github.com/FFmpeg/FFmpeg".insteadOf "https://git.ffmpeg.org/ffmpeg"
    - name: Clone submodules
      run: git submodule update --init --recursive
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: "21"
        distribution: "jetbrains"
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Run musikr unit tests
      run: ./gradlew :musikr:testDebugUnitTest --no-daemon
      continue-on-error: true
    - name: Decode signing keystore
      env:
        SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
      run: |
        if [ -z "$SIGNING_KEY_BASE64" ]; then
          echo "::warning::SIGNING_KEY_BASE64 is not set, falling back to a generated debug key"
          exit 0
        fi
        echo "$SIGNING_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/auxio.jks"
        echo "keystore restored: $(stat -c %s "$RUNNER_TEMP/auxio.jks") bytes"
    - name: Build arm64 canary APK with Gradle
      env:
        AUXIO_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        AUXIO_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        AUXIO_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      run: |
        ./gradlew app:packageCanary -PauxioAbi=arm64-v8a \
          -PauxioStoreFile="$RUNNER_TEMP/auxio.jks" \
          -PauxioStorePassword="$AUXIO_STORE_PASSWORD" \
          -PauxioKeyAlias="$AUXIO_KEY_ALIAS" \
          -PauxioKeyPassword="$AUXIO_KEY_PASSWORD"
    - name: Stage arm64 APK
      run: mkdir -p dist && cp app/build/outputs/apk/canary/app-canary.apk dist/Auxio_arm64.apk
    - name: Build universal canary APK with Gradle
      env:
        AUXIO_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        AUXIO_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        AUXIO_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      run: |
        ./gradlew app:packageCanary -PauxioAbi=all \
          -PauxioStoreFile="$RUNNER_TEMP/auxio.jks" \
          -PauxioStorePassword="$AUXIO_STORE_PASSWORD" \
          -PauxioKeyAlias="$AUXIO_KEY_ALIAS" \
          -PauxioKeyPassword="$AUXIO_KEY_PASSWORD"
    - name: Stage universal APK
      run: cp app/build/outputs/apk/canary/app-canary.apk dist/Auxio_universal.apk
    - name: Upload canary APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Auxio_Canary
        path: dist/*.apk
    - name: Publish canary release
      if: github.event_name == 'workflow_dispatch'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="cjk-$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)"
        cp dist/Auxio_arm64.apk "dist/Auxio_${TAG}_arm64.apk"
        cp dist/Auxio_universal.apk "dist/Auxio_${TAG}_universal.apk"
        gh release create "$TAG" \
          "dist/Auxio_${TAG}_arm64.apk" \
          "dist/Auxio_${TAG}_universal.apk" \
          --title "Canary $TAG" \
          --notes "自动构建。\`arm64\` 装 arm64 那个，模拟器/老设备用 \`universal\`。提交 ${GITHUB_SHA:0:7}。" \
          --prerelease
        echo "::notice::Release $TAG published"
